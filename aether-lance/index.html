<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0d17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="AETHER LANCE — an original horizontal-scrolling shoot 'em up for the browser." />
  <title>AETHER LANCE</title>
  <!-- Embedded font: DotGothic16 (subset). Copyright 2020 The DotGothic16 Project Authors
       (https://github.com/fontworks-fonts/DotGothic16). Licensed under the SIL Open Font License 1.1
       (https://openfontlicense.org); the full license text is in licenses/DotGothic16-OFL.txt. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; background: #000; }
    #app canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
    #overlay { pointer-events: none; }
    #fallback { color: #c6d2e3; font: 14px sans-serif; padding: 24px; }
  </style>
</head>
<body>
  <div id="app"><noscript><div id="fallback">AETHER LANCE requires JavaScript.</div></noscript></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

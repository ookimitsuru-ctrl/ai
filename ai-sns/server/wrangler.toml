name = "hitorigoto"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# mock | local | anthropic
#   local     : ローカルLLM(OpenAI互換API。Ollama / LM Studio / llama.cpp / mlx-lm など)。
#               LLM_MODEL と、必要なら LLM_BASE_URL(既定 http://localhost:11434/v1)を .dev.vars に書く
#   anthropic : Claude Haiku 5.5。ANTHROPIC_API_KEY をシークレットに入れる
LLM_PROVIDER = "mock"
# async: 投稿はすぐ返し、解析と返信生成は裏で行う / sync: 完了まで待つ(デバッグ用)
REPLY_MODE = "async"
# リアクションが表示されるまでの最大遅延(ms)。0 なら即時
REACTION_DELAY_MAX_MS = "180000"
# 1ユーザーの24時間あたり投稿上限
DAILY_POST_LIMIT = "10"

[[d1_databases]]
binding = "DB"
database_name = "hitorigoto"
# 本番デプロイ前に `wrangler d1 create hitorigoto` で発行した ID に置き換える
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# シークレット(コミットしない):
#   ローカル: .dev.vars に TOKEN_SECRET=... / ADMIN_KEY=... を書く
#   本番    : wrangler secret put TOKEN_SECRET / ADMIN_KEY

name: AETHER LANCE
on:
  push:
    paths: ['aether-lance/**', '.github/workflows/aether-lance.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: aether-lance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-lance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: aether-lance-single-html
          path: aether-lance/dist-single/aether-lance.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: aether-lance/dist
  deploy:
    # Publish to GitHub Pages from the default branch only (enable Pages → "GitHub Actions" in repo settings).
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: AETHER LANCE
on:
  push:
    paths: ['aether-lance/**', '.github/workflows/aether-lance.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: aether-lance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-lance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: npm run build:single:hd
      - uses: actions/upload-artifact@v4
        with:
          name: aether-lance-single-html
          path: |
            aether-lance/dist-single/aether-lance.html
            aether-lance/dist-single/aether-lance-hd.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: aether-lance/dist
  apk:
    # Android APKs, classic and HD editions (WebView shell around the single-file builds), signed with the shared key in aether-lance/android/keystore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-lance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: npm ci
      - run: ./android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aether-lance-apk
          path: |
            aether-lance/dist-apk/AetherLance.apk
            aether-lance/dist-apk/AetherLanceHD.apk
  deploy:
    # Publish to GitHub Pages from the default branch only (enable Pages → "GitHub Actions" in repo settings).
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
